kind = "web"
previewPath = "/"
title = "HEAVENx — بهشت منهوا"
version = "1.0.0"
id = "artifacts/heavenx"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21959

[services.development]
run = "pnpm --filter @workspace/heavenx run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/heavenx", "run", "build" ]
publicDir = "artifacts/heavenx/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21959"
BASE_PATH = "/"
