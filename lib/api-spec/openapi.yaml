openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: HEAVENx API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: series
  - name: chapters
  - name: upload
  - name: users
  - name: admin
  - name: comments
  - name: social
  - name: popup
  - name: settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /series:
    get:
      operationId: listSeries
      tags: [series]
      summary: List all series
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: genre
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesListResponse"
    post:
      operationId: createSeries
      tags: [series]
      summary: Create series (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesInput"
      responses:
        "201":
          description: Series created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"

  /series/trending:
    get:
      operationId: getTrendingSeries
      tags: [series]
      summary: Get trending series
      responses:
        "200":
          description: Trending series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Series"

  /series/latest:
    get:
      operationId: getLatestSeries
      tags: [series]
      summary: Get latest updated series
      responses:
        "200":
          description: Latest series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Series"

  /series/genres:
    get:
      operationId: listGenres
      tags: [series]
      summary: List genres
      responses:
        "200":
          description: Genres list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Genre"

  /series/{id}:
    get:
      operationId: getSeries
      tags: [series]
      summary: Get series by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Series detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
    patch:
      operationId: updateSeries
      tags: [series]
      summary: Update series (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesUpdate"
      responses:
        "200":
          description: Series updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
    delete:
      operationId: deleteSeries
      tags: [series]
      summary: Delete series (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /chapters/series/{seriesId}:
    get:
      operationId: listChapters
      tags: [chapters]
      summary: List chapters for a series
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chapters list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"

  /chapters/{id}:
    get:
      operationId: getChapter
      tags: [chapters]
      summary: Get chapter with pages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chapter detail with pages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterDetail"
    delete:
      operationId: deleteChapter
      tags: [chapters]
      summary: Delete chapter (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /upload/zip/status:
    get:
      operationId: getUploadStatus
      tags: [upload]
      summary: Get upload system status
      responses:
        "200":
          description: Upload status
          content:
            application/json:
              schema:
                type: object
                properties:
                  maxFileSize:
                    type: integer
                  allowedFormats:
                    type: array
                    items:
                      type: string
                required:
                  - maxFileSize
                  - allowedFormats

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin)
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /users/{id}/reset-device:
    post:
      operationId: resetUserDevice
      tags: [users]
      summary: Reset device lock for user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device reset

  /users/progress:
    post:
      operationId: saveProgress
      tags: [users]
      summary: Save reading progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: Progress saved

  /users/favorites/{seriesId}:
    post:
      operationId: addFavorite
      tags: [users]
      summary: Add series to favorites
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Added to favorites
    delete:
      operationId: removeFavorite
      tags: [users]
      summary: Remove series from favorites
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  /users/favorites:
    get:
      operationId: listFavorites
      tags: [users]
      summary: Get user favorites
      responses:
        "200":
          description: Favorites list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Series"

  /comments/chapter/{chapterId}:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for chapter
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Post comment on chapter
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete comment (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /ratings/chapter/{chapterId}:
    post:
      operationId: rateChapter
      tags: [comments]
      summary: Rate a chapter
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingResult"

  /social:
    get:
      operationId: listSocialLinks
      tags: [social]
      summary: List social media links
      responses:
        "200":
          description: Social links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialLink"
    post:
      operationId: createSocialLink
      tags: [social]
      summary: Create social link (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLinkInput"
      responses:
        "201":
          description: Social link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLink"

  /social/{id}:
    patch:
      operationId: updateSocialLink
      tags: [social]
      summary: Update social link (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLinkUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLink"
    delete:
      operationId: deleteSocialLink
      tags: [social]
      summary: Delete social link (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /popups:
    get:
      operationId: listPopups
      tags: [popup]
      summary: List popups
      responses:
        "200":
          description: Popups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Popup"
    post:
      operationId: createPopup
      tags: [popup]
      summary: Create popup (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Popup"

  /popups/{id}:
    patch:
      operationId: updatePopup
      tags: [popup]
      summary: Update popup (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopupUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Popup"
    delete:
      operationId: deletePopup
      tags: [popup]
      summary: Delete popup (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get site settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update site settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/all-comments:
    get:
      operationId: getAllComments
      tags: [admin]
      summary: Get all comments (admin)
      responses:
        "200":
          description: All comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
        deviceId:
          type: string

    AuthResponse:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        accessToken:
          type: string

    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [ADMIN, USER]
        isActive:
          type: boolean
        language:
          type: string
          enum: [DE, EN, FA]
        readMode:
          type: string
        darkMode:
          type: boolean
        deviceLockMode:
          type: string
        createdAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]

    AdminUser:
      type: object
      required: [id, username, role, isActive]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
        isActive:
          type: boolean
        language:
          type: string
        deviceLockMode:
          type: string
        deviceId:
          type: ["string", "null"]
        createdAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]

    UserInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
        role:
          type: string
        language:
          type: string

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
        role:
          type: string
        isActive:
          type: boolean
        language:
          type: string
        deviceLockMode:
          type: string

    Series:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
        title:
          type: string
        altTitle:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        cover:
          type: ["string", "null"]
        banner:
          type: ["string", "null"]
        author:
          type: ["string", "null"]
        artist:
          type: ["string", "null"]
        status:
          type: string
        views:
          type: integer
        likes:
          type: integer
        popularity:
          type: integer
        genres:
          type: array
          items:
            type: object
            properties:
              genre:
                type: object
                properties:
                  name:
                    type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    SeriesDetail:
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          properties:
            chapters:
              type: array
              items:
                $ref: "#/components/schemas/Chapter"

    SeriesListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Series"
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    SeriesInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        altTitle:
          type: string
        description:
          type: string
        cover:
          type: string
        banner:
          type: string
        author:
          type: string
        artist:
          type: string
        status:
          type: string
        genres:
          type: array
          items:
            type: string

    SeriesUpdate:
      type: object
      properties:
        title:
          type: string
        altTitle:
          type: string
        description:
          type: string
        cover:
          type: string
        banner:
          type: string
        author:
          type: string
        artist:
          type: string
        status:
          type: string
        genres:
          type: array
          items:
            type: string

    Genre:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    Chapter:
      type: object
      required: [id, seriesId, number, sortOrder]
      properties:
        id:
          type: string
        seriesId:
          type: string
        number:
          type: integer
        title:
          type: ["string", "null"]
        uploadDate:
          type: string
        views:
          type: integer
        pageCount:
          type: integer
        sortOrder:
          type: integer
        createdAt:
          type: string

    ChapterDetail:
      allOf:
        - $ref: "#/components/schemas/Chapter"
        - type: object
          properties:
            series:
              type: object
              properties:
                id:
                  type: string
                title:
                  type: string
            pages:
              type: array
              items:
                $ref: "#/components/schemas/ChapterPage"
            prevChapter:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                number:
                  type: integer
                title:
                  type: ["string", "null"]
            nextChapter:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                number:
                  type: integer
                title:
                  type: ["string", "null"]

    ChapterPage:
      type: object
      required: [id, chapterId, pageNumber, filePath, order]
      properties:
        id:
          type: string
        chapterId:
          type: string
        pageNumber:
          type: integer
        filePath:
          type: string
        fileName:
          type: string
        order:
          type: integer

    UploadResult:
      type: object
      required: [message, pageCount]
      properties:
        message:
          type: string
        pageCount:
          type: integer
        chapterId:
          type: string

    ProgressInput:
      type: object
      required: [seriesId, chapterId, page]
      properties:
        seriesId:
          type: string
        chapterId:
          type: string
        page:
          type: integer

    Comment:
      type: object
      required: [id, chapterId, userId, text, createdAt]
      properties:
        id:
          type: string
        chapterId:
          type: string
        userId:
          type: string
        username:
          type: string
        text:
          type: string
        isHidden:
          type: boolean
        createdAt:
          type: string

    CommentInput:
      type: object
      required: [text]
      properties:
        text:
          type: string

    RatingInput:
      type: object
      required: [stars]
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5

    RatingResult:
      type: object
      required: [average, count]
      properties:
        average:
          type: number
        count:
          type: integer

    SocialLink:
      type: object
      required: [id, platform, url, isEnabled]
      properties:
        id:
          type: string
        platform:
          type: string
        url:
          type: string
        label:
          type: ["string", "null"]
        isEnabled:
          type: boolean
        sortOrder:
          type: integer

    SocialLinkInput:
      type: object
      required: [platform, url]
      properties:
        platform:
          type: string
        url:
          type: string
        label:
          type: string
        isEnabled:
          type: boolean
        sortOrder:
          type: integer

    SocialLinkUpdate:
      type: object
      properties:
        platform:
          type: string
        url:
          type: string
        label:
          type: string
        isEnabled:
          type: boolean
        sortOrder:
          type: integer

    Popup:
      type: object
      required: [id, title, content, isEnabled]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        buttonText:
          type: ["string", "null"]
        buttonUrl:
          type: ["string", "null"]
        closeText:
          type: ["string", "null"]
        isEnabled:
          type: boolean
        scheduleStart:
          type: ["string", "null"]
        scheduleEnd:
          type: ["string", "null"]
        createdAt:
          type: string

    PopupInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        buttonText:
          type: string
        buttonUrl:
          type: string
        closeText:
          type: string
        isEnabled:
          type: boolean
        scheduleStart:
          type: string
        scheduleEnd:
          type: string

    PopupUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        buttonText:
          type: string
        buttonUrl:
          type: string
        closeText:
          type: string
        isEnabled:
          type: boolean
        scheduleStart:
          type: string
        scheduleEnd:
          type: string

    SiteSettings:
      type: object
      properties:
        siteName:
          type: string
        siteEnabled:
          type: boolean
        maintenanceMode:
          type: boolean
        maintenanceMessage:
          type: ["string", "null"]
        countdownTarget:
          type: ["string", "null"]
        announcement:
          type: ["string", "null"]
        primaryColor:
          type: string
        fontFamily:
          type: string
        bannerUrl:
          type: ["string", "null"]
        bannerOverlayText:
          type: ["string", "null"]

    SiteSettingsUpdate:
      type: object
      properties:
        siteName:
